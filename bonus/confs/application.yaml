apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: playground

  namespace: argocd

spec:
  project: default

  source:
    # In-cluster address of the GitLab service: gitlab.localhost only
    # resolves on the host, not inside the Argo CD pods
    repoURL: http://gitlab.gitlab.svc.cluster.local/root/yowazga-iot-app.git
    targetRevision: main
    path: .

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=false
