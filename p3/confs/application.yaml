apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: playground

  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/yowazga/yowazga-iot-app
    targetRevision: main
    path: .

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=false